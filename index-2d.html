<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>捏果糖 · 小熊软糖版 🐻🍬</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#fdf6ec,#f7e8d8);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
  #hud{position:fixed;top:14px;left:16px;z-index:2;color:#7a5b3f}
  #hud h1{margin:0;font-size:20px;letter-spacing:1px}
  #hud p{margin:4px 0 10px;font-size:13px;opacity:.75}
  #hud .row{display:flex;gap:10px;align-items:center;font-size:13px;flex-wrap:wrap}
  button{border:0;background:#fff;color:#7a5b3f;padding:8px 14px;border-radius:999px;box-shadow:0 2px 8px rgba(120,80,40,.15);cursor:pointer;font-size:13px}
  button:active{transform:scale(.95)}
  input[type=range]{accent-color:#e2557b;width:120px}
  canvas{display:block;position:fixed;inset:0}
</style>
</head>
<body>
<div id="hud">
  <h1>捏果糖 🐻🍬</h1>
  <p>拖拽拉伸 · 甩出去 · 双击加一颗 · 按久了会慢慢滑落</p>
  <div class="row">
    <button id="add">＋加一颗</button>
    <button id="squish">捏爆一下</button>
    <label>弹性 <input id="bounce" type="range" min="0" max="95" value="60"></label>
    <button id="reset">重置</button>
  </div>
</div>
<canvas id="c"></canvas>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

const G = 1900;
const SUB = 8;
let REST = 0.6;
document.getElementById('bounce').addEventListener('input', e => REST = e.target.value / 100);

const FLAVORS = [
  {name:'草莓', base:'#ff5d7f', deep:'#c22a52', glow:'#ffb3c6'},
  {name:'香橙', base:'#ff9f43', deep:'#d96c1c', glow:'#ffd9a8'},
  {name:'青提', base:'#7ecb5f', deep:'#4a9436', glow:'#c8efb4'},
  {name:'葡萄', base:'#9b6bde', deep:'#6a3fa8', glow:'#d6c2f5'},
  {name:'可乐', base:'#c96a4a', deep:'#8f3f26', glow:'#f0b7a2'},
  {name:'蓝莓', base:'#5b8def', deep:'#2f5cb8', glow:'#bcd3fb'},
];

// ---- gummy bear outline: star-shaped union of discs, origin at neck ----
// local coords, y down. [cx, cy, r]
const BEAR = [
  [0, -46, 27],     // head
  [-24, -66, 11],   // left ear
  [24, -66, 11],    // right ear
  [0, 22, 38],      // body
  [-38, 4, 13],     // left arm
  [38, 4, 13],      // right arm
  [-20, 62, 15],    // left leg
  [20, 62, 15],     // right leg
];
function bearOutline(N){
  const pts = [];
  for (let i = 0; i < N; i++){
    const a = -Math.PI/2 + i / N * Math.PI * 2;  // start at top
    let r = 0;
    for (const [cx, cy, cr] of BEAR){
      const b = cx * Math.cos(a) + cy * Math.sin(a);
      const c = cx*cx + cy*cy - cr*cr;
      const disc = b*b - c;
      if (disc >= 0) r = Math.max(r, -b + Math.sqrt(disc));
    }
    pts.push([r * Math.cos(a), r * Math.sin(a)]);
  }
  return pts;
}
const BEAR_N = 64;
const BEAR_REST = bearOutline(BEAR_N);
// which outline points belong to the head (for orientation spring + face)
const HEAD_IX = [], EAR_IX = [];
for (let i = 0; i < BEAR_N; i++){
  const [x, y] = BEAR_REST[i];
  if (y < -30) HEAD_IX.push(i);
  if (y < -55) EAR_IX.push(i);
}

class Candy {
  constructor(x, y, r, flavor, shape){
    this.flavor = flavor;
    this.r0 = r;
    this.shape = shape || null;   // null = round candy; array = bear rest outline
    this.N = shape ? shape.length : 22;
    const s = r / (shape ? 78 : r);  // bear local units ~156 tall -> scale
    this.pts = [];
    for (let i = 0; i < this.N; i++){
      let lx, ly;
      if (shape){ lx = shape[i][0] * s; ly = shape[i][1] * s; }
      else { const a = i / this.N * Math.PI * 2; lx = Math.cos(a) * r; ly = Math.sin(a) * r; }
      this.pts.push({x: x + lx, y: y + ly, vx: 0, vy: 0});
    }
    this.restLen = shape
      ? Math.hypot(shape[1][0]-shape[0][0], shape[1][1]-shape[0][1]) * s
      : 2 * r * Math.sin(Math.PI / this.N);
    this.restArea = this.polyArea(shape ? shape.map(p => [p[0]*s, p[1]*s]) : null, r);
    this.grab = null;
    this.gx = 0; this.gy = 0;
    this.breathe = Math.random() * Math.PI * 2;
  }
  polyArea(poly, r){
    if (!poly) return Math.PI * r * r;
    let a = 0;
    for (let i = 0; i < poly.length; i++){
      const p = poly[i], q = poly[(i+1) % poly.length];
      a += p.x !== undefined ? p.x*q.y - q.x*p.y : p[0]*q[1] - q[0]*p[1];
    }
    return Math.abs(a) / 2;
  }
  centroid(){
    let x = 0, y = 0;
    for (const p of this.pts){ x += p.x; y += p.y; }
    return [x / this.N, y / this.N];
  }
  area(){
    let a = 0;
    for (let i = 0; i < this.N; i++){
      const p = this.pts[i], q = this.pts[(i + 1) % this.N];
      a += p.x * q.y - q.x * p.y;
    }
    return Math.abs(a) / 2;
  }
  step(h, t){
    const K = 1400, KC = this.shape ? 520 : 1100, KP = this.shape ? 900 : 260, D = 0.997;
    // edge springs
    for (let i = 0; i < this.N; i++){
      const a = this.pts[i], b = this.pts[(i + 1) % this.N];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d = Math.hypot(dx, dy) || 1e-6;
      const f = K * (d - this.restLen) / d;
      a.vx += dx * f * h; a.vy += dy * f * h;
      b.vx -= dx * f * h; b.vy -= dy * f * h;
    }
    const [cx, cy] = this.centroid();
    if (this.shape){
      // shape memory: pull each point back to its rest offset (weak -> jiggly)
      const s = this.r0 / 78;
      const br = 1 + 0.02 * Math.sin(t * 2 + this.breathe);
      for (let i = 0; i < this.N; i++){
        const p = this.pts[i];
        const tx = cx + this.shape[i][0] * s * br, ty = cy + this.shape[i][1] * s * br;
        const f = KC * h;
        p.vx += (tx - p.x) * f; p.vy += (ty - p.y) * f;
      }
      // pressure (volume preservation)
      const A = this.area() || 1;
      for (let i = 0; i < this.N; i++){
        const p = this.pts[i], prev = this.pts[(i - 1 + this.N) % this.N], next = this.pts[(i + 1) % this.N];
        let nx = next.y - prev.y, ny = -(next.x - prev.x);
        const nl = Math.hypot(nx, ny) || 1e-6;
        const f = KP * (this.restArea - A) / this.restArea;
        p.vx += (nx / nl) * f * h * nl / this.r0 * 40; p.vy += (ny / nl) * f * h * nl / this.r0 * 40;
      }
      // gentle orientation spring: head anchor wants to sit above the centroid
      let hx = 0, hy = 0;
      for (const i of HEAD_IX){ hx += this.pts[i].x; hy += this.pts[i].y; }
      hx /= HEAD_IX.length; hy /= HEAD_IX.length;
      const restHead = 62 * (this.r0 / 78);
      const tx = cx, ty = cy - restHead;
      const fo = 260 * h;
      for (const i of HEAD_IX){
        this.pts[i].vx += (tx - this.pts[i].x) * fo;
        this.pts[i].vy += (ty - this.pts[i].y) * fo;
      }
    } else {
      // radial springs to centroid (round candy shape memory)
      for (const p of this.pts){
        let dx = p.x - cx, dy = p.y - cy;
        let d = Math.hypot(dx, dy) || 1e-6;
        const f = KC * (d - this.r0) / d;
        p.vx -= dx * f * h; p.vy -= dy * f * h;
      }
      const A = this.area() || 1;
      for (let i = 0; i < this.N; i++){
        const p = this.pts[i], prev = this.pts[(i - 1 + this.N) % this.N], next = this.pts[(i + 1) % this.N];
        let nx = next.y - prev.y, ny = -(next.x - prev.x);
        const nl = Math.hypot(nx, ny) || 1e-6;
        const f = KP * (this.restArea - A) / this.restArea;
        p.vx += (nx / nl) * f * h * nl / this.r0 * 40; p.vy += (ny / nl) * f * h * nl / this.r0 * 40;
      }
    }
    // grab spring toward pointer
    if (this.grab){
      const p = this.pts[this.grab.i];
      const k = 4200;
      p.vx += (this.gx - p.x) * k * h;
      p.vy += (this.gy - p.y) * k * h;
      p.vx *= 0.85; p.vy *= 0.85;
    }
    // integrate + collide
    for (const p of this.pts){
      p.vy += G * h;
      p.vx *= D; p.vy *= D;
      p.x += p.vx * h; p.y += p.vy * h;
      const m = 6;
      if (p.y > H - m){ p.y = H - m; if (p.vy > 0) p.vy = -p.vy * REST; p.vx *= 0.985; }
      if (p.y < m){ p.y = m; if (p.vy < 0) p.vy = -p.vy * REST; }
      if (p.x < m){ p.x = m; if (p.vx < 0) p.vx = -p.vx * REST; }
      if (p.x > W - m){ p.x = W - m; if (p.vx > 0) p.vx = -p.vx * REST; }
    }
  }
  hitTest(x, y){
    let best = -1, bd = 1e9;
    for (let i = 0; i < this.N; i++){
      const d = Math.hypot(this.pts[i].x - x, this.pts[i].y - y);
      if (d < bd){ bd = d; best = i; }
    }
    const [cx, cy] = this.centroid();
    if (Math.hypot(cx - x, cy - y) < this.r0 * 1.1 || bd < this.r0 * 0.8) return best;
    return -1;
  }
  faceFrame(){
    // world transform for face features: origin at centroid, up = head direction
    const [cx, cy] = this.centroid();
    let hx = 0, hy = 0;
    for (const i of HEAD_IX){ hx += this.pts[i].x; hy += this.pts[i].y; }
    hx /= HEAD_IX.length; hy /= HEAD_IX.length;
    let ux = hx - cx, uy = hy - cy;
    const ul = Math.hypot(ux, uy) || 1e-6;
    ux /= ul; uy /= ul;
    const restHeadDist = 62 * (this.r0 / 78);
    const scale = Math.max(0.4, Math.min(1.8, (restHeadDist + 16 * (this.r0/78)) / (Math.hypot(hx-cx, hy-cy) + 16 * (this.r0/78))));
    // local frame: +x is the bear's right, +y points away from the head (down the body).
    // head direction in world is (ux, uy), so local +y maps to world (-ux, -uy).
    const rx = -uy, ry = ux;   // local +x axis in world
    const T = (lx, ly) => [cx + (lx * rx - ly * ux) * scale, cy + (lx * ry - ly * uy) * scale];
    return {T, scale};
  }
  buildPath(){
    const P = this.pts, N = this.N;
    const path = new Path2D();
    let m0x = (P[N-1].x + P[0].x)/2, m0y = (P[N-1].y + P[0].y)/2;
    path.moveTo(m0x, m0y);
    for (let i = 0; i < N; i++){
      const p = P[i], q = P[(i+1) % N];
      path.quadraticCurveTo(p.x, p.y, (p.x + q.x)/2, (p.y + q.y)/2);
    }
    path.closePath();
    return path;
  }
  draw(t){
    const f = this.flavor, r = this.r0;
    const [cx, cy] = this.centroid();
    const path = this.buildPath();

    // --- contact shadow on the floor ---
    const floorDist = Math.max(0, (H - 6) - (cy + r));
    const shA = Math.max(0.06, 0.34 - floorDist / (H * 1.1));
    const shW = r * (1.1 + floorDist / (H * 0.55));
    const sg = ctx.createRadialGradient(cx, H - 10, 1, cx, H - 10, shW);
    sg.addColorStop(0, `rgba(80,50,30,${shA})`);
    sg.addColorStop(1, 'rgba(80,50,30,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.ellipse(cx, H - 10, shW, r * 0.3, 0, 0, Math.PI * 2); ctx.fill();

    // --- jelly body: translucent, lit from upper-left ---
    const base = ctx.createLinearGradient(cx - r * 0.5, cy - r * 1.1, cx + r * 0.3, cy + r * 1.1);
    base.addColorStop(0, f.glow);
    base.addColorStop(0.42, f.base);
    base.addColorStop(1, f.deep);
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = base;
    ctx.fill(path);
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.clip(path);
    // far side of the jelly seen through the front (depth core)
    ctx.save();
    ctx.translate(cx + r * 0.07, cy + r * 0.11);
    ctx.scale(0.85, 0.85);
    ctx.translate(-cx, -cy);
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = f.deep;
    ctx.fill(path);
    ctx.restore();
    // inner rim shadow (volume)
    ctx.globalAlpha = 0.45;
    ctx.strokeStyle = f.deep;
    ctx.lineWidth = r * 0.42;
    ctx.stroke(path);
    ctx.globalAlpha = 1;
    // rim light along lower-right edge
    ctx.save();
    ctx.translate(r * 0.055, r * 0.065);
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = f.glow;
    ctx.lineWidth = r * 0.15;
    ctx.stroke(path);
    ctx.restore();
    // thin cool rim on upper-left
    ctx.save();
    ctx.translate(-r * 0.03, -r * 0.04);
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = r * 0.06;
    ctx.stroke(path);
    ctx.restore();
    ctx.restore(); // unclip

    // glossy outline sheen
    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.lineWidth = 1.5;
    ctx.stroke(path);

    // specular: soft blob + sharp glint (light from upper-left)
    const hx = cx - r * 0.38, hy = cy - r * 0.55;
    const hg = ctx.createRadialGradient(hx, hy, 1, hx, hy, r * 0.55);
    hg.addColorStop(0, 'rgba(255,255,255,.75)');
    hg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.ellipse(hx, hy, r * 0.36, r * 0.24, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.ellipse(hx - r * 0.06, hy - r * 0.04, r * 0.07, r * 0.045, -0.6, 0, Math.PI * 2); ctx.fill();

    if (this.shape){
      // face
      const {T, scale} = this.faceFrame();
      const [ecx1, ecy1] = T(-11, -50), [ecx2, ecy2] = T(11, -50);
      const er = 3.4 * scale * (this.r0/78) * 2.2;
      // squint when stretched
      const stretched = this.area() < this.restArea * 0.72 || this.grab;
      ctx.fillStyle = 'rgba(60,25,25,.85)';
      for (const [ex, ey] of [[ecx1, ecy1],[ecx2, ecy2]]){
        ctx.beginPath();
        ctx.ellipse(ex, ey, er, stretched ? er*0.35 : er, 0, 0, Math.PI*2);
        ctx.fill();
      }
      // snout
      const [sx, sy] = T(0, -41);
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.beginPath(); ctx.ellipse(sx, sy, 7*scale*(this.r0/78)*2.2, 5*scale*(this.r0/78)*2.2, Math.atan2(T(1,0)[1]-cy, T(1,0)[0]-cx), 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(60,25,25,.7)';
      const [nx, ny] = T(0, -45);
      ctx.beginPath(); ctx.arc(nx, ny, 2.2*scale*(this.r0/78)*2.2, 0, Math.PI*2); ctx.fill();
      // soft sheen on the head (kept subtle so it reads as a highlight, not a blob)
      const [hx, hy] = T(-9, -58);
      const hg = ctx.createRadialGradient(hx, hy, 1, hx, hy, this.r0*0.3);
      hg.addColorStop(0, 'rgba(255,255,255,.45)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hg;
      ctx.beginPath(); ctx.ellipse(hx, hy, this.r0*0.2, this.r0*0.13, -0.5, 0, Math.PI*2); ctx.fill();
    }
  }
}

let candies = [];
let flavorIx = 0;
function spawn(x, y, r, bear){
  const f = FLAVORS[flavorIx++ % FLAVORS.length];
  const useBear = bear !== undefined ? bear : Math.random() < 0.7;
  candies.push(new Candy(x, y, r || (useBear ? 62 + Math.random()*22 : 50 + Math.random()*25), f, useBear ? BEAR_REST : null));
}
function reset(){
  candies = []; flavorIx = 0;
  const n = Math.min(5, Math.max(3, Math.floor(W / 260)));
  for (let i = 0; i < n; i++) spawn(W * (i + 1) / (n + 1), H * 0.35, 58 + Math.random()*22, i !== 2);
}
reset();
document.getElementById('add').onclick = () => spawn(W/2, 80);
document.getElementById('reset').onclick = reset;
document.getElementById('squish').onclick = () => {
  for (const c of candies){
    const [cx, cy] = c.centroid();
    for (const p of c.pts){
      const dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy) || 1;
      p.vx += dx / d * 900; p.vy += dy / d * 900;
    }
  }
};

let active = null;
function pos(e){ return [e.clientX, e.clientY]; }
cv.addEventListener('pointerdown', e => {
  const [x, y] = pos(e);
  for (let i = candies.length - 1; i >= 0; i--){
    const c = candies[i], idx = c.hitTest(x, y);
    if (idx >= 0){
      c.grab = {i: idx}; c.gx = x; c.gy = y; active = c;
      cv.setPointerCapture(e.pointerId);
      break;
    }
  }
});
cv.addEventListener('pointermove', e => {
  if (!active) return;
  const [x, y] = pos(e);
  active.gx = x; active.gy = y;
});
function release(){ if (active) active.grab = null; active = null; }
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('dblclick', e => spawn(e.clientX, e.clientY));

function separate(){
  for (let i = 0; i < candies.length; i++){
    for (let j = i + 1; j < candies.length; j++){
      const a = candies[i], b = candies[j];
      const [ax, ay] = a.centroid(), [bx, by] = b.centroid();
      let dx = bx - ax, dy = by - ay;
      let d = Math.hypot(dx, dy) || 1e-6;
      const min = (a.r0 + b.r0) * 0.92;
      if (d < min){
        const push = (min - d) * 0.5 / d;
        for (const p of a.pts){ p.x -= dx * push; p.y -= dy * push; }
        for (const p of b.pts){ p.x += dx * push; p.y += dy * push; }
      }
    }
  }
}

let last = performance.now();
function frame(now){
  const t = now / 1000;
  let dt = Math.min((now - last) / 1000, 1/30); last = now;
  const h = dt / SUB;
  for (let s = 0; s < SUB; s++){
    for (const c of candies) c.step(h, t);
    separate();
  }
  ctx.clearRect(0, 0, W, H);
  for (const c of candies) c.draw(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
